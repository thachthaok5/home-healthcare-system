name: CI / Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Regression & Verification Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit & regression tests with pytest
        env:
          PYTHONPATH: ./backend
        run: |
          pytest backend/tests/test_routing.py backend/tests/test_ai.py -v

      - name: Verify experimental data consistency
        env:
          PYTHONPATH: ./backend
        run: |
          python backend/scripts/verify_experiments.py
