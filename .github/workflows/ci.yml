name: CI / Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Regression & Verification Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: home_healthcare_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: ./backend
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: home_healthcare_db
      DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/home_healthcare_db

    steps:
      - name: Check out repository (full history for manifest provenance check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize PostgreSQL Database & Seed Data
        run: |
          python -c "from app.db.session import engine; from app.models import Base; Base.metadata.create_all(bind=engine); print('Database schema created successfully')"
          python backend/scripts/seed_database.py

      - name: Run all backend tests with pytest
        run: |
          pytest backend/tests/ -v --tb=short

      - name: Verify experimental data consistency & manifest provenance
        run: |
          python backend/scripts/verify_experiments.py

  frontend-build:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build
